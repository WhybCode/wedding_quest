name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES_BASE: /wedding_quest/
          # Voliteľné — ak secret chýba, build použije predvolený Apps Script endpoint v kóde
          VITE_FORMS_ENDPOINT: ${{ secrets.VITE_FORMS_ENDPOINT || 'https://script.google.com/macros/s/AKfycbzwHgw3HfWyvTnlA08n9fs2xSgz1E3qi8YcUnrXMbf7jovKgU-jHv41DvJKF6Wt-CM/exec' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
